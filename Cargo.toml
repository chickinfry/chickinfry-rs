[package]
name = "chickinfry"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native Rust runtime for Chickinfry"
repository = "https://github.com/chickinfry/chickinfry-rs"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
js-sys = "0.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
scrypt = { version = "0.11", default-features = false }
sha2 = "0.10"
subtle = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "=3.4.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
