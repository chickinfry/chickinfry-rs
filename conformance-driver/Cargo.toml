[package]
name = "chickinfry-conformance-driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
default = ["sdk"]
sdk = ["dep:chickinfry-client-plain", "dep:chickinfry-client-auth"]
conformance = ["chickinfry/conformance"]

[dependencies]
chickinfry = { path = "..", default-features = false }
chickinfry-client-plain = { version = "=0.1.0", optional = true }
chickinfry-client-auth = { version = "=0.1.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
